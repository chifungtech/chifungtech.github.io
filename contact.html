  <script>
    const revealItems = document.querySelectorAll('.card, .feature-grid article, .service-list article, .gallery img, .video-frame, .button, .hero img, .full-image');

    const revealObserver = new IntersectionObserver((entries, observer) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, {
      threshold: 0.15
    });

    revealItems.forEach((item) => {
      item.classList.add('reveal');
      revealObserver.observe(item);
    });

    const navToggle = document.querySelector('.nav-toggle');
    const header = document.querySelector('.site-header');

    if (navToggle && header) {
      navToggle.addEventListener('click', () => {
        const expanded = navToggle.getAttribute('aria-expanded') === 'true';
        navToggle.setAttribute('aria-expanded', String(!expanded));
        header.classList.toggle('open');
      });
    }

    const whatsAppButton = document.querySelector('.whatsapp-float');
    const updateWhatsAppOpacity = () => {
      if (!whatsAppButton) return;
      const scrollPosition = window.scrollY + window.innerHeight;
      const pageHeight = document.documentElement.scrollHeight;
      const nearBottom = scrollPosition >= pageHeight - 120;
      whatsAppButton.classList.toggle('dimmed', nearBottom);
    };
    window.addEventListener('scroll', updateWhatsAppOpacity, { passive: true });
    updateWhatsAppOpacity();
  </script>
